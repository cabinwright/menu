# detekt settings for kia-menu-style repos (lint.sh passes this file on top of detekt's
# defaults). Bugs and complexity stay on; rules that don't fit views built in code are off.
# A deliberately ignored exception is named `ignored` (or `expected`), which the exception
# rules accept: probing Kia's hidden APIs by reflection falls back on any failure.
complexity:
  TooManyFunctions:
    active: false          # activities and view helpers
  LongParameterList:
    constructorThreshold: 8
style:
  MagicNumber:
    active: false          # dp sizes and Kia's measured colours
  ReturnCount:
    max: 4
    excludeGuardClauses: true   # `val x = ... ?: return` checks up front
  MaxLineLength:
    maxLineLength: 120
naming:
  VariableNaming:
    active: false          # ktlint checks naming
